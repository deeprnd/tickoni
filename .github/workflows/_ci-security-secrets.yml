# Reusable Security/Secrets workflow: gitleaks scan.
# Cheap, runs early in parallel with quality.
name: Security Secrets Stage

on:
  workflow_call:

jobs:
  security-secrets:
    name: Security / Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create local main branch for diff-based quality scripts
        run: |
          git fetch origin main
          git branch --force main origin/main

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Setup gitleaks
        run: just setup-gitleaks-linux-x86

      - name: Run gitleaks check
        run: just security-gitleaks-check-all
