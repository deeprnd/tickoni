# Reusable Integration Test workflow: multi-component tests per platform.
# Downloads build artifact from Build stage (avoids redundant FD rebuilds).
# Reference: doc/execution/plans/v2.10-s8-5.md, doc/execution/plans/v2.10-s13.md
---
name: Integration Test Stage

'on':
  workflow_call:

jobs:
  integration-tests:
    name: Integration Tests / ${{ matrix.platform-name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Canonical: Linux x86_64
          - platform-name: Linux x86_64
            runner: ubuntu-24.04
            timeout_minutes: 30
            artifact-name: build-linux-x86
            platform: linux-x86
            test-recipe: test-integration-tk-linux-x86
            compiler: gcc-12
          # Linux x86_64 (clang)
          - platform-name: Linux x86_64 (clang)
            runner: ubuntu-24.04
            timeout_minutes: 30
            artifact-name: build-linux-x86-clang
            platform: linux-x86
            test-recipe: test-integration-tk-linux-x86
            compiler: clang-18
          # Linux ARM64
          - platform-name: Linux ARM
            runner: ubuntu-24.04-arm
            timeout_minutes: 30
            artifact-name: build-linux-arm
            platform: linux-arm
            test-recipe: test-integration-tk-linux-arm
            compiler: gcc-14
          # macOS 15 (x86_64)
          - platform-name: macOS 15 (x86_64)
            runner: macos-15-intel
            timeout_minutes: 30
            artifact-name: build-macos-15-x86_64
            platform: macos-x86
            test-recipe: test-integration-tk-macos-x86
            compiler: clang
          # macOS 15 (ARM)
          - platform-name: macOS 15 (ARM)
            runner: macos-15
            timeout_minutes: 30
            artifact-name: build-macos-15-arm
            platform: macos-arm
            test-recipe: test-integration-tk-macos-arm
            compiler: clang
          # macOS 26 (x86_64)
          - platform-name: macOS 26 (x86_64)
            runner: macos-26-intel
            timeout_minutes: 30
            artifact-name: build-macos-26-x86_64
            platform: macos-x86
            test-recipe: test-integration-tk-macos-x86
            compiler: clang
          # macOS 26 (ARM)
          - platform-name: macOS 26 (ARM)
            runner: macos-26
            timeout_minutes: 30
            artifact-name: build-macos-26-arm
            platform: macos-arm
            test-recipe: test-integration-tk-macos-arm
            compiler: clang
          # Windows x86_64
          - platform-name: Windows x86_64
            runner: windows-2025-vs2026
            timeout_minutes: 30
            artifact-name: build-windows-x86_64
            platform: windows-x86
            test-recipe: test-integration-tk-windows-x86
            compiler: msvc
          # Windows ARM64
          - platform-name: Windows ARM
            runner: windows-11-vs2026-arm
            timeout_minutes: 30
            artifact-name: build-windows-arm
            platform: windows-arm
            test-recipe: test-integration-tk-windows-arm
            compiler: msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Zig
        run: just setup-zig

      - name: Download build artifact (Build stage output)
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact-name }}
          path: .

      - name: Run integration tests
        run: just ${{ matrix.test-recipe }}
