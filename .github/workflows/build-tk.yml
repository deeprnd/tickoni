name: Build Tickoni

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-tk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          paths: '^((src/tickoni/|src/app/tickoni/|config/|contrib/fd-build-lib\.sh$|contrib/fd-build-windows\.(sh|ps1)$|contrib/fd-tk-libs\.sh$|justfile$|build\.zig$|\.zig-version$|GNUmakefile$|\.github/actions/build-fd-tk-libs/|\.github/workflows/build-tk\.yml$)|deps\.sh$)'

  # ── Linux: build FD libs + Zig tickoni ──────────────────────────────────────
  build-tk-linux:
    name: Harness Build / Linux
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - name: Build FD libs
        uses: ./.github/actions/build-fd-tk-libs

      - name: Run Zig build
        shell: bash
        run: bash contrib/ci-run-build-tk.sh

  # ── macOS: Clang (x86_64) ──────────────────────────────────────────────────
  build-tk-macos-15-x86_64:
    name: Harness Build / macOS 15 (x86_64)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - name: Install GNU make (macOS)
        if: runner.os == 'macOS'
        run: brew install make

      - name: Build FD libs
        run: just build-fd-macos-x86_64

      - name: Run Zig build
        shell: bash
        run: bash contrib/ci-run-build-tk.sh

  # ── macOS: Clang (ARM64) ───────────────────────────────────────────────────
  build-tk-macos-15-arm:
    name: Harness Build / macOS 15 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - name: Install GNU make (macOS)
        if: runner.os == 'macOS'
        run: brew install make

      - name: Build FD libs
        run: just build-fd-macos-arm

      - name: Run Zig build
        shell: bash
        run: bash contrib/ci-run-build-tk.sh

  # ── macOS: Clang (x86_64, macOS 26) ────────────────────────────────────────
  build-tk-macos-26-x86_64:
    name: Harness Build / macOS 26 (x86_64)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - name: Install GNU make (macOS)
        if: runner.os == 'macOS'
        run: brew install make

      - name: Build FD libs
        run: just build-fd-macos-x86_64

      - name: Run Zig build
        shell: bash
        run: bash contrib/ci-run-build-tk.sh

  # ── macOS: Clang (ARM64, macOS 26) ─────────────────────────────────────────
  build-tk-macos-26-arm:
    name: Harness Build / macOS 26 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'

      - name: Install GNU make (macOS)
        if: runner.os == 'macOS'
        run: brew install make

      - name: Build FD libs
        run: just build-fd-macos-arm

      - name: Run Zig build
        shell: bash
        run: bash contrib/ci-run-build-tk.sh

  # ── Windows: x86_64 ─────────────────────────────────────────────────────────
  build-tk-windows-x86:
    name: Harness Build / Windows x86_64
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Windows deps
        shell: pwsh
        run: |
          & "$Env:GITHUB_WORKSPACE\contrib\setup\windows-x86.ps1" -NoLLM

      - name: Build FD libs
        run: just build-fd-windows-x86

      - name: Run Zig build
        shell: bash
        run: bash contrib/ci-run-build-tk.sh

  # ── Windows: ARM64 ──────────────────────────────────────────────────────────
  build-tk-windows-arm:
    name: Harness Build / Windows ARM64
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Windows deps
        shell: pwsh
        run: |
          & "$Env:GITHUB_WORKSPACE\contrib\setup\windows-arm.ps1" -NoLLM

      - name: Build FD libs
        run: just build-fd-windows-arm

      - name: Run Zig build
        shell: bash
        run: bash contrib/ci-run-build-tk.sh
