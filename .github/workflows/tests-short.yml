name: Tests / Short

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-short-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          paths: '^(src/(app/tickoni|tickoni)/|build\.zig(\.zon)?$|justfile$|contrib/quality/|contrib/security/|contrib/test/|contrib/tool/|\.github/actions/|\.github/workflows/tests-short\.yml$)'

  short-tests:
    name: Harness Unit Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-linux-x86-gcc
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          security: 'false'

      - uses: ./.github/actions/build-fd-tk-libs

      - name: Run unit tests
        run: just test-unit-tk-linux-x86

  # ── Harness Tests: macOS 15 (x86_64) ───────────────────────────────────────
  short-tests-macos-15-x86_64:
    name: Harness Unit Tests / macOS 15 (x86_64)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-macos-x86
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          security: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-recipe: build-fd-macos-x86

      - name: Run unit tests
        run: just test-unit-tk-macos-x86

  # ── Harness Tests: macOS 15 (ARM) ──────────────────────────────────────────
  short-tests-macos-15-arm:
    name: Harness Unit Tests / macOS 15 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-macos-arm
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          security: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-recipe: build-fd-macos-arm

      - name: Run unit tests
        run: just test-unit-tk-macos-arm

  # ── Harness Tests: macOS 26 (x86_64) ───────────────────────────────────────
  short-tests-macos-26-x86_64:
    name: Harness Unit Tests / macOS 26 (x86_64)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-macos-x86
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          security: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-recipe: build-fd-macos-x86

      - name: Run unit tests
        run: just test-unit-tk-macos-x86

  # ── Harness Tests: macOS 26 (ARM) ──────────────────────────────────────────
  short-tests-macos-26-arm:
    name: Harness Unit Tests / macOS 26 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-macos-arm
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          security: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-recipe: build-fd-macos-arm

      - name: Run unit tests
        run: just test-unit-tk-macos-arm

  # ── Harness Tests: Windows x86_64 ──────────────────────────────────────────
  short-tests-windows-x86_64:
    name: Harness Unit Tests / Windows x86_64
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Windows deps
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-windows-ci-x86

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-recipe: build-fd-windows-x86

      - name: Run unit tests
        run: just test-unit-tk-windows-x86

  # ── Harness Tests: Windows ARM ─────────────────────────────────────────────
  short-tests-windows-arm:
    name: Harness Unit Tests / Windows ARM
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Windows deps
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-windows-ci-arm

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-recipe: build-fd-windows-arm

      - name: Run unit tests
        run: just test-unit-tk-windows-arm

  # ── Harness Tests: macOS 15 (x86_64) ───────────────────────────────────────
  test-demo-macos-15-x86_64:
    name: Demo Conformance / macOS 15 (x86_64)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-macos-x86
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          security: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-recipe: build-fd-macos-x86

      - name: Run demo conformance suite
        run: just test-demo-tk-macos-x86

  # ── Harness Tests: macOS 15 (ARM) ──────────────────────────────────────────
  test-demo-macos-15-arm:
    name: Demo Conformance / macOS 15 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-macos-arm
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          security: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-recipe: build-fd-macos-arm

      - name: Run demo conformance suite
        run: just test-demo-tk-macos-arm

  # ── Harness Tests: macOS 26 (x86_64) ───────────────────────────────────────
  test-demo-macos-26-x86_64:
    name: Demo Conformance / macOS 26 (x86_64)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-macos-x86
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          security: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-recipe: build-fd-macos-x86

      - name: Run demo conformance suite
        run: just test-demo-tk-macos-x86

  # ── Harness Tests: macOS 26 (ARM) ──────────────────────────────────────────
  test-demo-macos-26-arm:
    name: Demo Conformance / macOS 26 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-macos-arm
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          security: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-recipe: build-fd-macos-arm

      - name: Run demo conformance suite
        run: just test-demo-tk-macos-arm

  # ── Demo Conformance: Linux ─────────────────────────────────────────────────
  demo-conformance-linux:
    name: Demo Conformance / Linux
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-linux-x86-gcc
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          security: 'false'

      - uses: ./.github/actions/build-fd-tk-libs

      - name: Build and export Linux conformance bundle
        run: just export-demo-conformance-linux

      - name: Upload Linux conformance bundle
        uses: actions/upload-artifact@v7
        with:
          name: demo-conformance-linux
          path: build/demo-conformance/linux

  # ── Demo Conformance: macOS 15 (x86_64) ────────────────────────────────────
  demo-conformance-macos-15-x86_64:
    name: Demo Conformance / macOS 15 (x86_64)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-macos-x86
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          security: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-recipe: build-fd-macos-x86

      - name: Build and export macOS 15 x86_64 conformance bundle
        run: just export-demo-conformance-macos-15-x86_64

      - name: Upload macOS 15 x86_64 conformance bundle
        uses: actions/upload-artifact@v7
        with:
          name: demo-conformance-macos-15-x86_64
          path: build/demo-conformance/macos-15-x86_64

  # ── Demo Conformance: macOS 15 (ARM) ───────────────────────────────────────
  demo-conformance-macos-15-arm:
    name: Demo Conformance / macOS 15 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-macos-arm
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          security: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-recipe: build-fd-macos-arm

      - name: Build and export macOS 15 ARM conformance bundle
        run: just export-demo-conformance-macos-15-arm

      - name: Upload macOS 15 ARM conformance bundle
        uses: actions/upload-artifact@v7
        with:
          name: demo-conformance-macos-15-arm
          path: build/demo-conformance/macos-15-arm

  # ── Demo Conformance: macOS 26 (x86_64) ────────────────────────────────────
  demo-conformance-macos-26-x86_64:
    name: Demo Conformance / macOS 26 (x86_64)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-macos-x86
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          security: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-recipe: build-fd-macos-x86

      - name: Build and export macOS 26 x86_64 conformance bundle
        run: just export-demo-conformance-macos-26-x86_64

      - name: Upload macOS 26 x86_64 conformance bundle
        uses: actions/upload-artifact@v7
        with:
          name: demo-conformance-macos-26-x86_64
          path: build/demo-conformance/macos-26-x86_64

  # ── Demo Conformance: macOS 26 (ARM) ───────────────────────────────────────
  demo-conformance-macos-26-arm:
    name: Demo Conformance / macOS 26 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-macos-arm
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          security: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-recipe: build-fd-macos-arm

      - name: Build and export macOS 26 ARM conformance bundle
        run: just export-demo-conformance-macos-26-arm

      - name: Upload macOS 26 ARM conformance bundle
        uses: actions/upload-artifact@v7
        with:
          name: demo-conformance-macos-26-arm
          path: build/demo-conformance/macos-26-arm

  # ── Demo Conformance: Windows x86_64 ───────────────────────────────────────
  demo-conformance-windows-x86:
    name: Demo Conformance / Windows x86_64
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-windows-ci-x86
          zig: 'true'
          fd-deps: 'false'
          compiler: clang
          compiler-version: system

      - name: Build FD libs
        run: just build-fd-windows-x86

      - name: Build and export Windows x86_64 conformance bundle
        run: just export-demo-conformance-windows-x86

      - name: Upload Windows x86_64 conformance bundle
        uses: actions/upload-artifact@v7
        with:
          name: demo-conformance-windows-x86
          path: build/demo-conformance/windows-x86

  # ── Demo Conformance: Windows ARM ──────────────────────────────────────────
  demo-conformance-windows-arm:
    name: Demo Conformance / Windows ARM
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-windows-ci-arm
          zig: 'true'
          fd-deps: 'false'
          compiler: clang
          compiler-version: system

      - name: Build FD libs
        run: just build-fd-windows-arm

      - name: Build and export Windows ARM conformance bundle
        run: just export-demo-conformance-windows-arm

      - name: Upload Windows ARM conformance bundle
        uses: actions/upload-artifact@v7
        with:
          name: demo-conformance-windows-arm
          path: build/demo-conformance/windows-arm

  # ── System Tests: Windows x86_64 (live llama.cpp, mirrors Linux/macOS) ──────
  system-tests-windows-x86:
    name: System Tests / Windows x86_64
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-windows-ci-x86
          zig: 'true'
          fd-deps: 'false'
          compiler: clang
          compiler-version: system

      - name: Run Windows x86_64 system-test just recipe
        shell: bash
        run: just test-system-tk-windows-x86

  # ── System Tests: Windows ARM (live llama.cpp, mirrors Linux/macOS) ──────
  system-tests-windows-arm:
    name: System Tests / Windows ARM
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-windows-ci-arm
          zig: 'true'
          fd-deps: 'false'
          compiler: clang
          compiler-version: system

      - name: Run Windows ARM system-test just recipe
        shell: bash
        run: just test-system-tk-windows-arm

  # ── Demo Conformance: Compare ───────────────────────────────────────────────
  demo-conformance-compare:
    name: Demo Conformance Compare / All Platforms
    needs:
      - demo-conformance-linux
      - demo-conformance-macos-15-x86_64
      - demo-conformance-macos-15-arm
      - demo-conformance-macos-26-x86_64
      - demo-conformance-macos-26-arm
      - demo-conformance-windows-x86
      - demo-conformance-windows-arm
    if: >-
      needs.demo-conformance-linux.result == 'success' &&
      needs.demo-conformance-macos-15-x86_64.result == 'success' &&
      needs.demo-conformance-macos-15-arm.result == 'success' &&
      needs.demo-conformance-macos-26-x86_64.result == 'success' &&
      needs.demo-conformance-macos-26-arm.result == 'success' &&
      needs.demo-conformance-windows-x86.result == 'success' &&
      needs.demo-conformance-windows-arm.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Linux conformance bundle
        uses: actions/download-artifact@v8
        with:
          name: demo-conformance-linux
          path: build/demo-conformance/linux

      - name: Download macOS 15 x86_64 conformance bundle
        uses: actions/download-artifact@v8
        with:
          name: demo-conformance-macos-15-x86_64
          path: build/demo-conformance/macos-15-x86_64

      - name: Download macOS 15 ARM conformance bundle
        uses: actions/download-artifact@v8
        with:
          name: demo-conformance-macos-15-arm
          path: build/demo-conformance/macos-15-arm

      - name: Download macOS 26 x86_64 conformance bundle
        uses: actions/download-artifact@v8
        with:
          name: demo-conformance-macos-26-x86_64
          path: build/demo-conformance/macos-26-x86_64

      - name: Download macOS 26 ARM conformance bundle
        uses: actions/download-artifact@v8
        with:
          name: demo-conformance-macos-26-arm
          path: build/demo-conformance/macos-26-arm

      - name: Download Windows x86_64 conformance bundle
        uses: actions/download-artifact@v8
        with:
          name: demo-conformance-windows-x86
          path: build/demo-conformance/windows-x86

      - name: Download Windows ARM64 conformance bundle
        uses: actions/download-artifact@v8
        with:
          name: demo-conformance-windows-arm
          path: build/demo-conformance/windows-arm

      - name: Compare all platform conformance bundles
        run: just compare-demo-conformance
