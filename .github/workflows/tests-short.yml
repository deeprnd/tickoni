name: Tests / Short

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-short-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          paths: '^(src/(app/tickoni|tickoni)/|build\.zig(\.zon)?$|justfile$|contrib/quality\.sh$|contrib/security\.sh$|contrib/test/(run_cli_demo_tests\.sh|export_demo_conformance_bundle\.py|compare_demo_conformance\.py)$|contrib/readme/coverage_report\.py$|\.github/actions/|\.github/workflows/tests-short\.yml$)'

  short-tests:
    name: Harness Unit Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          gitleaks: 'false'

      - uses: ./.github/actions/build-fd-tk-libs

      - name: Run unit tests
        run: just test-unit-tk

  # ── Harness Tests: macOS 15 (x86_64) ───────────────────────────────────────
  short-tests-macos-15-x86_64:
    name: Harness Unit Tests / macOS 15 (x86_64)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15-xlarge
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          gitleaks: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-profile: macos-x86_64

      - name: Run unit tests
        run: just test-unit-tk

  # ── Harness Tests: macOS 15 (ARM) ──────────────────────────────────────────
  short-tests-macos-15-arm:
    name: Harness Unit Tests / macOS 15 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15-xlarge
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          gitleaks: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-profile: macos-arm

      - name: Run unit tests
        run: just test-unit-tk

  # ── Harness Tests: macOS 26 (x86_64) ───────────────────────────────────────
  short-tests-macos-26-x86_64:
    name: Harness Unit Tests / macOS 26 (x86_64)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26-xlarge
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          gitleaks: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-profile: macos-x86_64

      - name: Run unit tests
        run: just test-unit-tk

  # ── Harness Tests: macOS 26 (ARM) ──────────────────────────────────────────
  short-tests-macos-26-arm:
    name: Harness Unit Tests / macOS 26 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26-xlarge
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          gitleaks: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-profile: macos-arm

      - name: Run unit tests
        run: just test-unit-tk

  # ── Harness Tests: Windows x86_64 ──────────────────────────────────────────
  short-tests-windows-x86_64:
    name: Harness Unit Tests / Windows x86_64
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          fd-deps: 'false'
          compiler: clang
          compiler-version: system

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-profile: windows-x86_64

      - name: Run unit tests
        run: just test-unit-tk-windows-x86

  # ── Harness Tests: Windows ARM ─────────────────────────────────────────────
  short-tests-windows-arm:
    name: Harness Unit Tests / Windows ARM
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          fd-deps: 'false'
          compiler: clang
          compiler-version: system

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-profile: windows-arm

      - name: Run unit tests
        run: just test-unit-tk-windows-arm

  # ── Harness Tests: macOS 15 (x86_64) ───────────────────────────────────────
  test-demo-macos-15-x86_64:
    name: Demo Conformance / macOS 15 (x86_64)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15-xlarge
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          gitleaks: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-profile: macos-x86_64

      - name: Run demo conformance suite
        run: just test-demo-tk

  # ── Harness Tests: macOS 15 (ARM) ──────────────────────────────────────────
  test-demo-macos-15-arm:
    name: Demo Conformance / macOS 15 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15-xlarge
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          gitleaks: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-profile: macos-arm

      - name: Run demo conformance suite
        run: just test-demo-tk

  # ── Harness Tests: macOS 26 (x86_64) ───────────────────────────────────────
  test-demo-macos-26-x86_64:
    name: Demo Conformance / macOS 26 (x86_64)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26-xlarge
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          gitleaks: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-profile: macos-x86_64

      - name: Run demo conformance suite
        run: just test-demo-tk

  # ── Harness Tests: macOS 26 (ARM) ──────────────────────────────────────────
  test-demo-macos-26-arm:
    name: Demo Conformance / macOS 26 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26-xlarge
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          gitleaks: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-profile: macos-arm

      - name: Run demo conformance suite
        run: just test-demo-tk

  # ── Demo Conformance: Linux ─────────────────────────────────────────────────
  demo-conformance-linux:
    name: Demo Conformance / Linux
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          gitleaks: 'false'

      - uses: ./.github/actions/build-fd-tk-libs

      - name: Build supervisor
        run: ZIG_GLOBAL_CACHE_DIR=.zig-global-cache bash contrib/zigw.sh build -Dfd-lib-dir=build/fd-tickoni-fd/lib

      - name: Export Linux conformance bundle
        run: python3 contrib/test/export_demo_conformance_bundle.py . build/demo-conformance/linux

      - name: Upload Linux conformance bundle
        uses: actions/upload-artifact@v7
        with:
          name: demo-conformance-linux
          path: build/demo-conformance/linux

  # ── Demo Conformance: macOS 15 (x86_64) ────────────────────────────────────
  demo-conformance-macos-15-x86_64:
    name: Demo Conformance / macOS 15 (x86_64)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15-xlarge
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          gitleaks: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-profile: macos-x86_64

      - name: Build supervisor
        run: ZIG_GLOBAL_CACHE_DIR=.zig-global-cache bash contrib/zigw.sh build -Dfd-lib-dir=build/fd-tickoni-fd/lib

      - name: Export macOS 15 x86_64 conformance bundle
        run: python3 contrib/test/export_demo_conformance_bundle.py . build/demo-conformance/macos-15-x86_64

      - name: Upload macOS 15 x86_64 conformance bundle
        uses: actions/upload-artifact@v7
        with:
          name: demo-conformance-macos-15-x86_64
          path: build/demo-conformance/macos-15-x86_64

  # ── Demo Conformance: macOS 15 (ARM) ───────────────────────────────────────
  demo-conformance-macos-15-arm:
    name: Demo Conformance / macOS 15 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15-xlarge
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          gitleaks: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-profile: macos-arm

      - name: Build supervisor
        run: ZIG_GLOBAL_CACHE_DIR=.zig-global-cache bash contrib/zigw.sh build -Dfd-lib-dir=build/fd-tickoni-fd/lib

      - name: Export macOS 15 ARM conformance bundle
        run: python3 contrib/test/export_demo_conformance_bundle.py . build/demo-conformance/macos-15-arm

      - name: Upload macOS 15 ARM conformance bundle
        uses: actions/upload-artifact@v7
        with:
          name: demo-conformance-macos-15-arm
          path: build/demo-conformance/macos-15-arm

  # ── Demo Conformance: macOS 26 (x86_64) ────────────────────────────────────
  demo-conformance-macos-26-x86_64:
    name: Demo Conformance / macOS 26 (x86_64)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26-xlarge
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          gitleaks: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-profile: macos-x86_64

      - name: Build supervisor
        run: ZIG_GLOBAL_CACHE_DIR=.zig-global-cache bash contrib/zigw.sh build -Dfd-lib-dir=build/fd-tickoni-fd/lib

      - name: Export macOS 26 x86_64 conformance bundle
        run: python3 contrib/test/export_demo_conformance_bundle.py . build/demo-conformance/macos-26-x86_64

      - name: Upload macOS 26 x86_64 conformance bundle
        uses: actions/upload-artifact@v7
        with:
          name: demo-conformance-macos-26-x86_64
          path: build/demo-conformance/macos-26-x86_64

  # ── Demo Conformance: macOS 26 (ARM) ───────────────────────────────────────
  demo-conformance-macos-26-arm:
    name: Demo Conformance / macOS 26 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26-xlarge
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          kcov: 'false'
          fd-deps: 'false'
          gitleaks: 'false'

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-profile: macos-arm

      - name: Build supervisor
        run: ZIG_GLOBAL_CACHE_DIR=.zig-global-cache bash contrib/zigw.sh build -Dfd-lib-dir=build/fd-tickoni-fd/lib

      - name: Export macOS 26 ARM conformance bundle
        run: python3 contrib/test/export_demo_conformance_bundle.py . build/demo-conformance/macos-26-arm

      - name: Upload macOS 26 ARM conformance bundle
        uses: actions/upload-artifact@v7
        with:
          name: demo-conformance-macos-26-arm
          path: build/demo-conformance/macos-26-arm

  # ── Demo Conformance: Windows x86_64 ───────────────────────────────────────
  demo-conformance-windows-x86:
    name: Demo Conformance / Windows x86_64
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          fd-deps: 'false'
          compiler: clang
          compiler-version: system

      - name: Build FD libs
        run: just build-fd-windows-x86

      - name: Build supervisor
        shell: bash
        run: ZIG_GLOBAL_CACHE_DIR=.zig-global-cache bash contrib/zigw.sh build -Dfd-lib-dir=build/fd-tickoni-fd/lib --summary all

      - name: Export Windows x86_64 conformance bundle
        shell: bash
        run: python3 contrib/test/export_demo_conformance_bundle.py . build/demo-conformance/windows-x86

      - name: Upload Windows x86_64 conformance bundle
        uses: actions/upload-artifact@v7
        with:
          name: demo-conformance-windows-x86
          path: build/demo-conformance/windows-x86

  # ── Demo Conformance: Windows ARM ──────────────────────────────────────────
  demo-conformance-windows-arm:
    name: Demo Conformance / Windows ARM
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          fd-deps: 'false'
          compiler: clang
          compiler-version: system

      - name: Build FD libs
        run: just build-fd-windows-arm

      - name: Build supervisor
        shell: bash
        run: ZIG_GLOBAL_CACHE_DIR=.zig-global-cache bash contrib/zigw.sh build -Dfd-lib-dir=build/fd-tickoni-fd/lib --summary all

      - name: Export Windows ARM conformance bundle
        shell: bash
        run: python3 contrib/test/export_demo_conformance_bundle.py . build/demo-conformance/windows-arm

      - name: Upload Windows ARM conformance bundle
        uses: actions/upload-artifact@v7
        with:
          name: demo-conformance-windows-arm
          path: build/demo-conformance/windows-arm

  # ── System Tests: Windows x86_64 (live llama.cpp, mirrors Linux/macOS) ──────
  system-tests-windows-x86:
    name: System Tests / Windows x86_64
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          fd-deps: 'false'
          compiler: clang
          compiler-version: system

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-profile: windows-x86_64

      - name: Build llama.cpp + run live system test
        shell: bash
        run: ZIG_GLOBAL_CACHE_DIR=.zig-global-cache bash contrib/test/run_system_model_tests_win.sh

  # ── System Tests: Windows ARM (live llama.cpp, mirrors Linux/macOS) ──────
  system-tests-windows-arm:
    name: System Tests / Windows ARM
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup deps + Zig
        uses: ./.github/actions/setup-public-gh-runner
        with:
          zig: 'true'
          fd-deps: 'false'
          compiler: clang
          compiler-version: system

      - uses: ./.github/actions/build-fd-tk-libs
        with:
          build-profile: windows-arm

      - name: Build llama.cpp + run live system test
        shell: bash
        run: ZIG_GLOBAL_CACHE_DIR=.zig-global-cache bash contrib/test/run_system_model_tests_win.sh

  # ── Demo Conformance: Compare ───────────────────────────────────────────────
  demo-conformance-compare:
    name: Demo Conformance Compare / All Platforms
    needs:
      - demo-conformance-linux
      - demo-conformance-macos-15-x86_64
      - demo-conformance-macos-15-arm
      - demo-conformance-macos-26-x86_64
      - demo-conformance-macos-26-arm
      - demo-conformance-windows-x86
      - demo-conformance-windows-arm
    if: >-
      needs.demo-conformance-linux.result == 'success' &&
      needs.demo-conformance-macos-15-x86_64.result == 'success' &&
      needs.demo-conformance-macos-15-arm.result == 'success' &&
      needs.demo-conformance-macos-26-x86_64.result == 'success' &&
      needs.demo-conformance-macos-26-arm.result == 'success' &&
      needs.demo-conformance-windows-x86.result == 'success' &&
      needs.demo-conformance-windows-arm.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Linux conformance bundle
        uses: actions/download-artifact@v8
        with:
          name: demo-conformance-linux
          path: build/demo-conformance/linux

      - name: Download macOS 15 x86_64 conformance bundle
        uses: actions/download-artifact@v8
        with:
          name: demo-conformance-macos-15-x86_64
          path: build/demo-conformance/macos-15-x86_64

      - name: Download macOS 15 ARM conformance bundle
        uses: actions/download-artifact@v8
        with:
          name: demo-conformance-macos-15-arm
          path: build/demo-conformance/macos-15-arm

      - name: Download macOS 26 x86_64 conformance bundle
        uses: actions/download-artifact@v8
        with:
          name: demo-conformance-macos-26-x86_64
          path: build/demo-conformance/macos-26-x86_64

      - name: Download macOS 26 ARM conformance bundle
        uses: actions/download-artifact@v8
        with:
          name: demo-conformance-macos-26-arm
          path: build/demo-conformance/macos-26-arm

      - name: Download Windows x86_64 conformance bundle
        uses: actions/download-artifact@v8
        with:
          name: demo-conformance-windows-x86
          path: build/demo-conformance/windows-x86

      - name: Download Windows ARM64 conformance bundle
        uses: actions/download-artifact@v8
        with:
          name: demo-conformance-windows-arm
          path: build/demo-conformance/windows-arm

      - name: Compare all platform conformance bundles
        run: |
          python3 contrib/test/compare_demo_conformance.py \
            build/demo-conformance/linux/conformance.json \
            build/demo-conformance/macos-15-x86_64/conformance.json \
            build/demo-conformance/macos-15-arm/conformance.json \
            build/demo-conformance/macos-26-x86_64/conformance.json \
            build/demo-conformance/macos-26-arm/conformance.json \
            build/demo-conformance/windows-x86/conformance.json \
            build/demo-conformance/windows-arm/conformance.json
