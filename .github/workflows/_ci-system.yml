# Reusable System Test workflow: live-LLM tests per platform.
# Downloads build artifact from Build stage (avoids redundant FD rebuilds).
# Reference: doc/execution/plans/v2.10-s8-5.md, doc/execution/plans/v2.10-s13.md
---
name: System Test Stage

'on':
  workflow_call:

jobs:
  system-tests:
    name: System Tests / ${{ matrix.platform-name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Canonical: Linux x86_64
          - platform-name: Linux x86_64
            runner: ubuntu-24.04
            timeout_minutes: 60
            artifact-name: build-linux-x86
            test-recipe: test-system-tk-linux-x86
            compiler: gcc-12
            llamacpp: infra-ensure-llamacpp
          # Linux x86_64 (clang)
          - platform-name: Linux x86_64 (clang)
            runner: ubuntu-24.04
            timeout_minutes: 60
            artifact-name: build-linux-x86-clang
            test-recipe: test-system-tk-linux-x86
            compiler: clang-18
            llamacpp: infra-ensure-llamacpp
          # Linux ARM64
          - platform-name: Linux ARM
            runner: ubuntu-24.04-arm
            timeout_minutes: 60
            artifact-name: build-linux-arm
            test-recipe: test-system-tk-linux-arm
            compiler: gcc-14
            llamacpp: infra-ensure-llamacpp
          # macOS 15 (x86_64)
          - platform-name: macOS 15 (x86_64)
            runner: macos-15-intel
            timeout_minutes: 60
            artifact-name: build-macos-15-x86_64
            test-recipe: test-system-tk-macos-x86
            compiler: clang
            llamacpp: infra-ensure-llamacpp
          # macOS 15 (ARM)
          - platform-name: macOS 15 (ARM)
            runner: macos-15
            timeout_minutes: 60
            artifact-name: build-macos-15-arm
            test-recipe: test-system-tk-macos-arm
            compiler: clang
            llamacpp: infra-ensure-llamacpp
          # macOS 26 (x86_64)
          - platform-name: macOS 26 (x86_64)
            runner: macos-26-intel
            timeout_minutes: 60
            artifact-name: build-macos-26-x86_64
            test-recipe: test-system-tk-macos-x86
            compiler: clang
            llamacpp: infra-ensure-llamacpp
          # macOS 26 (ARM)
          - platform-name: macOS 26 (ARM)
            runner: macos-26
            timeout_minutes: 60
            artifact-name: build-macos-26-arm
            test-recipe: test-system-tk-macos-arm
            compiler: clang
            llamacpp: infra-ensure-llamacpp
          # Windows x86_64
          - platform-name: Windows x86_64
            runner: windows-2025-vs2026
            timeout_minutes: 60
            artifact-name: build-windows-x86_64
            test-recipe: test-system-tk-windows-x86
            compiler: msvc
            llamacpp: infra-ensure-llamacpp-win
          # Windows ARM64
          - platform-name: Windows ARM
            runner: windows-11-vs2026-arm
            timeout_minutes: 60
            artifact-name: build-windows-arm
            test-recipe: test-system-tk-windows-arm
            compiler: msvc
            llamacpp: infra-ensure-llamacpp-win-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Cache Zig SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/zig
            ~/.cache/zig
            ~/scoop/apps/zig
          key: zig-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('contrib/setup/install-zig.py', 'contrib/setup/tool-versions.json') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ matrix.platform }}-

      - name: Cache Firedancer deps (snappy, rockdb, openssl)
        uses: actions/cache@v4
        with:
          path: build/fd-deps
          key: fd-deps-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.compiler }}-${{ hashFiles('contrib/setup/tool-versions.json') }}
          restore-keys: |
            fd-deps-${{ runner.os }}-${{ matrix.platform }}-

      - name: Download build artifact (Build stage output)
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact-name }}
          path: .

      - name: Ensure llama.cpp is available
        run: just ${{ matrix.llamacpp }}

      - name: Run system tests
        run: just ${{ matrix.test-recipe }}
