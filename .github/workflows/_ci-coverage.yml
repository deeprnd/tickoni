# Reusable Coverage workflow: called by ci.yml as a DAG node.
# Builds FD libs locally on the same runner that runs coverage,
# mirroring the unit test pattern — no artifact downloads.
#
# Reference: doc/execution/plans/v2.10-s10.md
#
---
name: Coverage Stage

'on':
  workflow_call:

jobs:
  coverage:
    name: Tests / Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install kcov
        run: sudo apt-get install -y kcov

      - name: Setup toolchain
        run: just setup-build-linux-x86-gcc

      - name: Setup Firedancer deps (zig + SSL)
        run: just setup-fd-linux-x86-gcc

      - name: Build Firedancer libs locally
        run: just build-fd-linux-x86-gcc

      - name: Run coverage test
        run: just test-cov-tk

      - name: Generate coverage summary JSON
        run: |
          python3 contrib/tool/readme/coverage_report.py coverage-tk \
            build/coverage/tk \
            build/coverage/tk/coverage-summary.json \
            --config contrib/test/coverage-tk.json
