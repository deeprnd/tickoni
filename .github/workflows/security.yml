name: Security

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Always runs: fast secret scanning, independent of changed files ──

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: taiki-e/install-action@just
        with:
          fetch-depth: 0

      - name: Setup public GitHub runner
        run: just setup-linux-x86-gcc

      - name: Run check
        run: just security-gitleaks-check-linux-x86

  # ── Change-gated: seccomp, sanitizers, codeql ──

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@just

      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          paths: '^(src/|build\.zig(\.zon)?$|justfile$|contrib/security\.sh$|contrib/gitleaks-fd\.toml$|contrib/codeql/|\.github/actions/|\.github/workflows/security\.yml$)'

  checks:
    name: ${{ matrix.name }}
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SecComp
            timeout_minutes: 10
            command: just security-seccomp-check-linux-x86
            security: 'false'
            fd_deps: 'false'
            zig: 'false'
            apt_packages: ''
            compiler: gcc
            compiler_version: system
            setup_recipe: setup-linux-x86-gcc
            deps_recipe: setup-fd-deps-linux-x86-gcc
          - name: Sanitizers
            timeout_minutes: 45
            command: just security-sanitize-check-linux-x86
            security: 'false'
            fd_deps: 'true'
            zig: 'true'
            apt_packages: "clang"
            compiler: clang
            compiler_version: system
            setup_recipe: setup-linux-x86-clang
            deps_recipe: setup-fd-deps-linux-x86-clang
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: taiki-e/install-action@just
        with:
          fetch-depth: 0

      - name: Install apt packages
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Setup compiler + toolchain
        run: just ${{ matrix.setup_recipe }}

      - name: Install FD deps
        if: matrix.fd_deps == 'true'
        run: just ${{ matrix.deps_recipe }}

      - name: Run check
        run: ${{ matrix.command }}
