# Dev Setup Canary Workflow — standalone sanity-check for the entire
# developer experience end-to-end.
#
# This is NOT part of the PR-required DAG. It validates:
#   just setup-env → just build-all → just test-unit-tk → just test-integration-all → just test-system-all
#
# Trigger: workflow_dispatch / scheduled (e.g. nightly)
# Purpose: catch toolchain drift early, before it hits PRs.

name: Tests / Dev Setup Canary

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5'  # Weekdays at 06:00 UTC

permissions:
  contents: read

concurrency:
  group: dev-setup-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Linux x86_64 ─────────────────────────────────────────────────────────
  dev-setup-linux-x86:
    name: Dev Setup / Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Full dev setup
        run: just setup-env

      - name: Build all
        run: just build-all

      - name: Unit tests (Tickoni)
        run: just test-unit-tk

      # FD unit tests are blocked (known issue).
      # just test-unit-fd → skipped

      - name: Integration tests
        run: just test-integration-all

      - name: System tests
        run: just test-system-all

  # ── Linux ARM64 ──────────────────────────────────────────────────────────
  dev-setup-linux-arm:
    name: Dev Setup / Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Full dev setup
        run: just setup-env

      - name: Build all
        run: just build-all

      - name: Unit tests (Tickoni)
        run: just test-unit-tk

      - name: Integration tests
        run: just test-integration-all

  # ── macOS 15 x86_64 ──────────────────────────────────────────────────────
  dev-setup-macos-x86:
    name: Dev Setup / macOS 15 (x86_64)
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Full dev setup
        run: just setup-env

      - name: Build all
        run: just build-all

      - name: Unit tests (Tickoni)
        run: just test-unit-tk

      - name: Integration tests
        run: just test-integration-all

  # ── macOS 15 ARM64 ───────────────────────────────────────────────────────
  dev-setup-macos-arm:
    name: Dev Setup / macOS 15 (ARM)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Full dev setup
        run: just setup-env

      - name: Build all
        run: just build-all

      - name: Unit tests (Tickoni)
        run: just test-unit-tk

      - name: Integration tests
        run: just test-integration-all

  # ── Windows x86_64 ───────────────────────────────────────────────────────
  dev-setup-windows-x86:
    name: Dev Setup / Windows x86_64
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Full dev setup
        run: just setup-env

      - name: Build all
        run: just build-all

      - name: Unit tests (Tickoni)
        run: just test-unit-tk

      - name: Integration tests
        run: just test-integration-all

  # ── Windows ARM64 ────────────────────────────────────────────────────────
  dev-setup-windows-arm:
    name: Dev Setup / Windows ARM64
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Full dev setup
        run: just setup-env

      # Windows ARM: start with build-all only (integration/system tests
      # untested on this platform).
      - name: Build all
        run: just build-all
