# Reusable Unit Test workflow: component tests per platform.
# Downloads build artifact from Build stage (avoids redundant FD rebuilds).
# Reference: doc/execution/plans/v2.10-s8-5.md, doc/execution/plans/v2.10-s13.md
---
name: Unit Test Stage

permissions:
  contents: read

'on':
  workflow_call:

jobs:
  unit-tests:
    name: Unit Tests / ${{ matrix.platform-name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Canonical: Linux x86_64
          - platform-name: Linux x86_64
            runner: ubuntu-24.04
            timeout_minutes: 30
            artifact-name: build-linux-x86
            platform: linux-x86
            fd-test-recipe: test-unit-fd-linux-x86-gcc
            test-recipe: test-unit-tk-linux-x86
            cli-test-recipe: test-unit-cli-linux-x86
            infra-build-recipe: test-unit-infra-build
            infra-setup-recipe: test-unit-infra-setup
            infra-tooling-recipe: test-unit-infra-tooling
            compiler: gcc-12
          # Linux x86_64 (clang)
          - platform-name: Linux x86_64 (clang)
            runner: ubuntu-24.04
            timeout_minutes: 30
            artifact-name: build-linux-x86-clang
            platform: linux-x86
            fd-test-recipe: test-unit-fd-linux-x86-clang
            test-recipe: test-unit-tk-linux-x86
            cli-test-recipe: test-unit-cli-linux-x86
            infra-build-recipe: test-unit-infra-build
            infra-setup-recipe: test-unit-infra-setup
            infra-tooling-recipe: test-unit-infra-tooling
            compiler: clang-18
          # Linux ARM64
          - platform-name: Linux ARM
            runner: ubuntu-24.04-arm
            timeout_minutes: 30
            artifact-name: build-linux-arm
            platform: linux-arm
            fd-test-recipe: test-unit-fd-linux-arm-gcc
            test-recipe: test-unit-tk-linux-arm
            cli-test-recipe: test-unit-cli-linux-arm
            infra-build-recipe: test-unit-infra-build
            infra-setup-recipe: test-unit-infra-setup
            infra-tooling-recipe: test-unit-infra-tooling
            compiler: gcc-14
          # macOS 15 (x86_64)
          - platform-name: macOS 15 (x86_64)
            runner: macos-15-intel
            timeout_minutes: 30
            artifact-name: build-macos-15-x86
            platform: macos-x86
            fd-test-recipe: test-unit-fd-macos-x86
            test-recipe: test-unit-tk-macos-x86
            cli-test-recipe: test-unit-cli-macos-x86
            infra-build-recipe: test-unit-infra-build
            infra-setup-recipe: test-unit-infra-setup
            infra-tooling-recipe: test-unit-infra-tooling
            compiler: clang
          # macOS 15 (ARM)
          - platform-name: macOS 15 (ARM)
            runner: macos-15
            timeout_minutes: 30
            artifact-name: build-macos-15-arm
            platform: macos-arm
            fd-test-recipe: test-unit-fd-macos-arm
            test-recipe: test-unit-tk-macos-arm
            cli-test-recipe: test-unit-cli-macos-arm
            infra-build-recipe: test-unit-infra-build
            infra-setup-recipe: test-unit-infra-setup
            infra-tooling-recipe: test-unit-infra-tooling
            compiler: clang
          # macOS 26 (x86_64)
          - platform-name: macOS 26 (x86_64)
            runner: macos-26-intel
            timeout_minutes: 30
            artifact-name: build-macos-26-x86
            platform: macos-x86
            fd-test-recipe: test-unit-fd-macos-x86
            test-recipe: test-unit-tk-macos-x86
            cli-test-recipe: test-unit-cli-macos-x86
            infra-build-recipe: test-unit-infra-build
            infra-setup-recipe: test-unit-infra-setup
            infra-tooling-recipe: test-unit-infra-tooling
            compiler: clang
          # macOS 26 (ARM)
          - platform-name: macOS 26 (ARM)
            runner: macos-26
            timeout_minutes: 30
            artifact-name: build-macos-26-arm
            platform: macos-arm
            fd-test-recipe: test-unit-fd-macos-arm
            test-recipe: test-unit-tk-macos-arm
            cli-test-recipe: test-unit-cli-macos-arm
            infra-build-recipe: test-unit-infra-build
            infra-setup-recipe: test-unit-infra-setup
            infra-tooling-recipe: test-unit-infra-tooling
            compiler: clang
          # Windows x86_64
          - platform-name: Windows x86_64
            runner: windows-2025-vs2026
            timeout_minutes: 30
            artifact-name: build-windows-x86
            platform: windows-x86
            fd-test-recipe: test-unit-fd-windows-x86
            test-recipe: test-unit-tk-windows-x86
            cli-test-recipe: test-unit-cli-windows-x86
            infra-build-recipe: test-unit-infra-build
            infra-setup-recipe: test-unit-infra-setup
            infra-tooling-recipe: test-unit-infra-tooling
            compiler: msvc
          # Windows ARM64
          - platform-name: Windows ARM
            runner: windows-11-vs2026-arm
            timeout_minutes: 30
            artifact-name: build-windows-arm
            platform: windows-arm
            fd-test-recipe: test-unit-fd-windows-arm
            test-recipe: test-unit-tk-windows-arm
            cli-test-recipe: test-unit-cli-windows-arm
            infra-build-recipe: test-unit-infra-build
            infra-setup-recipe: test-unit-infra-setup
            infra-tooling-recipe: test-unit-infra-tooling
            compiler: msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Zig
        run: just setup-zig

      - name: Download build artifact (Build stage output)
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact-name }}
          path: .

      - name: Install test tools (pytest)
        run: just setup-test-${{ matrix.platform }}

      - name: Run Python unit tests (pytest)
        run: just test-unit-infra-all

      - name: Configure hugepages and memory limits (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo prlimit --pid $$ --nofile=65536 --memlock=unlimited
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' || true
          sudo src/util/shmem/fd_shmem_cfg init 0700 "$USER" ""
          just system-mem-alloc-auto || true

      - name: Install build toolchain (macOS)
        if: runner.os == 'macOS'
        run: just setup-build-${{ matrix.platform }}

      - name: Install Firedancer toolchain (Windows)
        if: runner.os == 'Windows'
        run: just setup-fd-${{ matrix.platform }}

      - name: Run Firedancer unit tests
        run: just ${{ matrix.fd-test-recipe }}

      - name: Run Tickoni unit tests
        run: just ${{ matrix.test-recipe }}

      - name: Run CLI unit tests
        run: just ${{ matrix.cli-test-recipe }}

      - name: Run Python infrastructure unit tests (build)
        run: just ${{ matrix.infra-build-recipe }}

      - name: Run Python infrastructure unit tests (setup)
        run: just ${{ matrix.infra-setup-recipe }}

      - name: Run Python infrastructure unit tests (tooling)
        run: just ${{ matrix.infra-tooling-recipe }}
