# Reusable Unit Test workflow: component tests per platform.
# Downloads build artifact from Build stage (avoids redundant FD rebuilds).
# Reference: doc/execution/plans/v2.10-s8-5.md, doc/execution/plans/v2.10-s13.md
---
name: Unit Test Stage

permissions:
  contents: read

'on':
  workflow_call:

jobs:
  unit-tests:
    name: Unit Tests / ${{ matrix.platform-name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Canonical: Linux x86_64
          - platform-name: Linux x86_64
            runner: ubuntu-24.04
            timeout_minutes: 30
            artifact-name: build-linux-x86
            fd-test-recipe: test-unit-fd-linux-x86-gcc
            test-recipe: test-unit-tk-linux-x86
            build-recipe: build-fd-linux-x86-gcc
            fd-deps: setup-fd-linux-x86-gcc
            setup-recipe: setup-build-linux-x86-gcc
          # Linux x86_64 (clang)
          - platform-name: Linux x86_64 (clang)
            runner: ubuntu-24.04
            timeout_minutes: 30
            artifact-name: build-linux-x86-clang
            fd-test-recipe: test-unit-fd-linux-x86-clang
            test-recipe: test-unit-tk-linux-x86
            build-recipe: build-fd-linux-x86-clang
            fd-deps: setup-fd-linux-x86-clang
            setup-recipe: setup-build-linux-x86-clang
          # Linux ARM64
          - platform-name: Linux ARM
            runner: ubuntu-24.04-arm
            timeout_minutes: 30
            artifact-name: build-linux-arm
            fd-test-recipe: test-unit-fd-linux-arm-gcc
            test-recipe: test-unit-tk-linux-arm
            build-recipe: build-fd-linux-arm-gcc
            fd-deps: setup-fd-linux-arm-gcc
            setup-recipe: setup-build-linux-arm-gcc
          # macOS 15 (x86_64)
          - platform-name: macOS 15 (x86_64)
            runner: macos-15-intel
            timeout_minutes: 30
            artifact-name: build-macos-15-x86_64
            fd-test-recipe: test-unit-fd-macos-x86
            test-recipe: test-unit-tk-macos-x86
            build-recipe: build-fd-macos-x86
            fd-deps: setup-fd-macos-x86
            setup-recipe: setup-build-macos-x86
          # macOS 15 (ARM)
          - platform-name: macOS 15 (ARM)
            runner: macos-15
            timeout_minutes: 30
            artifact-name: build-macos-15-arm
            fd-test-recipe: test-unit-fd-macos-arm
            test-recipe: test-unit-tk-macos-arm
            build-recipe: build-fd-macos-arm
            fd-deps: setup-fd-macos-arm
            setup-recipe: setup-build-macos-arm
          # macOS 26 (x86_64)
          - platform-name: macOS 26 (x86_64)
            runner: macos-26-intel
            timeout_minutes: 30
            artifact-name: build-macos-26-x86_64
            fd-test-recipe: test-unit-fd-macos-x86
            test-recipe: test-unit-tk-macos-x86
            build-recipe: build-fd-macos-x86
            fd-deps: setup-fd-macos-x86
            setup-recipe: setup-build-macos-x86
          # macOS 26 (ARM)
          - platform-name: macOS 26 (ARM)
            runner: macos-26
            timeout_minutes: 30
            artifact-name: build-macos-26-arm
            fd-test-recipe: test-unit-fd-macos-arm
            test-recipe: test-unit-tk-macos-arm
            build-recipe: build-fd-macos-arm
            fd-deps: setup-fd-macos-arm
            setup-recipe: setup-build-macos-arm
          # Windows x86_64
          - platform-name: Windows x86_64
            runner: windows-2025-vs2026
            timeout_minutes: 30
            artifact-name: build-windows-x86_64
            fd-test-recipe: test-unit-fd-windows-x86
            test-recipe: test-unit-tk-windows-x86
            build-recipe: build-fd-windows-x86
            fd-deps: setup-fd-windows-x86
            setup-recipe: setup-fd-windows-x86
          # Windows ARM64
          - platform-name: Windows ARM
            runner: windows-11-vs2026-arm
            timeout_minutes: 30
            artifact-name: build-windows-arm
            fd-test-recipe: test-unit-fd-windows-arm
            test-recipe: test-unit-tk-windows-arm
            build-recipe: build-fd-windows-arm
            fd-deps: setup-fd-windows-arm
            setup-recipe: setup-fd-windows-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Download build artifact (Build stage output)
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact-name }}
          path: .

      - name: Run Python unit tests (pytest)
        run: just test-unit-setup

      - name: Configure hugepages and memory limits (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo prlimit --pid $$ --nofile=65536 --memlock=unlimited
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' || true
          sudo src/util/shmem/fd_shmem_cfg init 0700 "$USER" ""
          just mem-alloc-auto || true

      - name: Run Firedancer unit tests
        run: just ${{ matrix.fd-test-recipe }}

      - name: Run Tickoni unit tests
        run: just ${{ matrix.test-recipe }}
