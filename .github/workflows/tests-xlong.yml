name: Tests / XLong

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-xlong-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@just

      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          paths: '^(src/|build\.zig(\.zon)?$|justfile$|contrib/test/|contrib/build/make-j$|\.github/actions/|\.github/workflows/tests-xlong\.yml$)'

  xlong-tests:
    name: Engine E2E Tests
    needs: detect-changes
    if: false && needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: taiki-e/install-action@just

      - name: Setup minimal FD deps (Linux GCC)
        run: just setup-fd-linux-x86-gcc

      - name: Enable all CPUs
        uses: ./.github/actions/cpusonline

      - name: Configure hugepages
        uses: ./.github/actions/memory-management
        with:
          count_gigantic: 6
          count_huge: 64

      - name: Run test suite
        run: just test-e2e-fd

  system-tests-tk:
    name: LLM System Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: taiki-e/install-action@just

      - name: Setup minimal FD deps (Linux GCC)
        run: just setup-fd-linux-x86-gcc

      - uses: ./.github/actions/build-fd-tk-libs

      - name: Setup build deps for llama.cpp
        run: just setup-build-linux-x86-gcc

      - name: Run test suite
        run: just test-system-tk
