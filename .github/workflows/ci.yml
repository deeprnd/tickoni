# Orchestrator CI workflow — staged DAG with fail-open change detection.
#
# Reference: doc/execution/plans/v2.10-s8-5.md
#
# Execution order:
#   (quality, security-secrets) -> build (matrix) -> project-build (aggregate)
#     -> unit tests -> (integration, system, demo, coverage in parallel)
#     -> conformance (after demo)
#     -> project-tests (after integration+system+demo+conformance)
#     -> security-deep (after project-tests) -> project-security (aggregate)
#     -> ci-required
#
# Dev Setup Validation runs standalone: weekly on Mondays + on-demand via
# .github/workflows/tests-dev-setup.yml

---
name: CI

'on':
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── PLAN: single change classifier (fail-open) ────────────────────────────
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.plan.outputs.core }}
      docs: ${{ steps.plan.outputs.docs }}
      book: ${{ steps.plan.outputs.book }}
      benchmark: ${{ steps.plan.outputs.benchmark }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/plan-ci
        id: plan
        with:
          base_ref: ${{ github.base_ref }}
          event_name: ${{ github.event_name }}

  # ── QUALITY: format, lint, proto — no FD build needed ─────────────────────
  quality:
    name: Quality
    needs: plan
    if: needs.plan.outputs.core == 'true'
    uses: ./.github/workflows/_ci-quality.yml

  # ── SECURITY/SECRETS: gitleaks — runs in parallel with quality ───────────
  security-secrets:
    name: Security / Secrets
    needs: plan
    if: needs.plan.outputs.core == 'true'
    uses: ./.github/workflows/_ci-security-secrets.yml

  # ── BUILD: all platforms in parallel (depends on quality + secrets) ──────
  build:
    name: Build
    needs: [plan, quality, security-secrets]
    if: >-
      needs.plan.outputs.core == 'true' &&
      needs.quality.result == 'success' &&
      needs.security-secrets.result == 'success'
    uses: ./.github/workflows/_ci-build.yml
    secrets: inherit

  # ── PROJECT BUILD: aggregated build gate ──────────────────────────────────
  project-build:
    name: Project Build
    needs: [plan, build]
    if: >-
      always() &&
      needs.plan.outputs.core == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Project Build aggregated
        run: echo done

  # ── UNIT: component tests per platform (downloads build artifact) ────────
  unit:
    name: Tests / Unit
    needs: [plan, project-build]
    if: >-
      always() &&
      needs.plan.outputs.core == 'true' &&
      needs.project-build.result == 'success'
    uses: ./.github/workflows/_ci-unit.yml

  # ── INTEGRATION: multi-component tests per platform ──────────────────────
  integration:
    name: Tests / Integration
    needs: [plan, project-build, unit]
    if: >-
      always() &&
      needs.plan.outputs.core == 'true' &&
      needs.project-build.result == 'success' &&
      needs.unit.result == 'success'
    uses: ./.github/workflows/_ci-integration.yml

  # ── SYSTEM: live-LLM tests per platform ──────────────────────────────────
  system:
    name: Tests / System
    needs: [plan, project-build, unit]
    if: >-
      always() &&
      needs.plan.outputs.core == 'true' &&
      needs.project-build.result == 'success' &&
      needs.unit.result == 'success'
    uses: ./.github/workflows/_ci-system.yml

  # ── DEMO: fixture-backed demos per platform ──────────────────────────────
  demo:
    name: Tests / Demo
    needs: [plan, project-build, unit]
    if: >-
      always() &&
      needs.plan.outputs.core == 'true' &&
      needs.project-build.result == 'success' &&
      needs.unit.result == 'success'
    uses: ./.github/workflows/_ci-demo.yml

  # ── COVERAGE: Tickoni harness coverage (parallel with integration/system/demo) ──
  coverage:
    name: Tests / Coverage
    needs: [plan, project-build, unit]
    if: >-
      always() &&
      needs.plan.outputs.core == 'true' &&
      needs.project-build.result == 'success' &&
      needs.unit.result == 'success'
    uses: ./.github/workflows/_ci-coverage.yml

  # ── CONFORMANCE: cross-platform binary comparison (after demo) ───────────
  conformance:
    name: Tests / Conformance
    needs: [plan, demo]
    if: >-
      always() &&
      needs.plan.outputs.core == 'true' &&
      needs.demo.result == 'success'
    uses: ./.github/workflows/_ci-conformance.yml

  # ── PROJECT TESTS: aggregated test gate ────────────────────────────────────
  # (coverage runs in parallel but does not gate project-tests — it's diagnostic-only)
  project-tests:
    name: Project Tests
    needs:
      [plan, project-build, unit, integration, system, demo, conformance]
    if: >-
      always() &&
      needs.plan.outputs.core == 'true' &&
      needs.project-build.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.system.result == 'success' &&
      needs.demo.result == 'success' &&
      needs.conformance.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Project Tests aggregated
        run: echo done

  # ── SECURITY / DEEP: 4 parallel sub-checks (sanitize, seccomp, proof, engine) ──
  security-deep-sanitize:
    name: Security / Deep — sanitize
    needs: [plan, project-build, project-tests]
    if: >-
      always() &&
      needs.plan.outputs.core == 'true' &&
      needs.project-build.result == 'success' &&
      needs.project-tests.result == 'success'
    uses: ./.github/workflows/_ci-security-deep.yml
    with:
      check: sanitize

  security-deep-seccomp:
    name: Security / Deep — seccomp
    needs: [plan, project-build, project-tests]
    if: >-
      always() &&
      needs.plan.outputs.core == 'true' &&
      needs.project-build.result == 'success' &&
      needs.project-tests.result == 'success'
    uses: ./.github/workflows/_ci-security-deep.yml
    with:
      check: seccomp

  security-deep-proof:
    name: Security / Deep — proof
    needs: [plan, project-build, project-tests]
    if: >-
      always() &&
      needs.plan.outputs.core == 'true' &&
      needs.project-build.result == 'success' &&
      needs.project-tests.result == 'success'
    uses: ./.github/workflows/_ci-security-deep.yml
    with:
      check: proof

  security-deep-engine:
    name: Security / Deep — engine
    needs: [plan, project-build, project-tests]
    if: >-
      always() &&
      needs.plan.outputs.core == 'true' &&
      needs.project-build.result == 'success' &&
      needs.project-tests.result == 'success'
    uses: ./.github/workflows/_ci-security-deep.yml
    with:
      check: engine

  security-deep-sanitize-qt:
    name: Security / Deep — sanitize-qt
    needs: [plan, project-build, project-tests]
    if: >-
      always() &&
      needs.plan.outputs.core == 'true' &&
      needs.project-build.result == 'success' &&
      needs.project-tests.result == 'success'
    uses: ./.github/workflows/_ci-security-deep.yml
    secrets: inherit
    with:
      check: sanitize-qt

  # ── PROJECT SECURITY: aggregated security gate ────────────────────────────
  project-security:
    name: Project Security
    needs:
      [plan, security-secrets,
       security-deep-sanitize, security-deep-seccomp,
       security-deep-proof, security-deep-engine,
       security-deep-sanitize-qt]
    if: >-
      always() &&
      needs.plan.outputs.core == 'true' &&
      needs.security-secrets.result == 'success' &&
      needs.security-deep-sanitize.result == 'success' &&
      needs.security-deep-seccomp.result == 'success' &&
      needs.security-deep-proof.result == 'success' &&
      needs.security-deep-engine.result == 'success' &&
      needs.security-deep-sanitize-qt.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Project Security aggregated
        run: echo done


  # ── CI / Required: aggregated gate for branch protection ─────────────────
  ci-required:
    name: CI / Required
    needs:
      [plan, quality, security-secrets,
       project-build, project-tests, project-security]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check CI results
        shell: bash
        env:
          PLAN_CORE: ${{ needs.plan.outputs.core }}
        run: |
          results=""
          failures=""

          for job in plan quality security-secrets \
              project-build project-tests project-security; do
            case "$job" in
              plan) status="${{ needs.plan.result }}" ;;
              quality) status="${{ needs.quality.result }}" ;;
              security-secrets) \
                status="${{ needs.security-secrets.result }}" ;;
              project-build) \
                status="${{ needs.project-build.result }}" ;;
              project-tests) \
                status="${{ needs.project-tests.result }}" ;;
              project-security) \
                status="${{ needs.project-security.result }}" ;;
            esac
            results="$results $job=$status"
            if [ "$status" = "success" ]; then
              :
            elif [ "$status" = "skipped" ]; then
              :
            else
              failures="$failures $job=$status"
            fi
          done

          # If core=false, all non-plan jobs should be skipped.
          if [ "${{ needs.plan.outputs.core }}" = "false" ]; then
            expected_skipped=5 # quality, security-secrets, project-build, project-tests, project-security
            # Count skipped
            skipped=0
            for job in quality security-secrets project-build project-tests project-security; do
              case "$job" in
                quality) s="${{ needs.quality.result }}" ;;
                security-secrets) s="${{ needs.security-secrets.result }}" ;;
                project-build) s="${{ needs.project-build.result }}" ;;
                project-tests) s="${{ needs.project-tests.result }}" ;;
                project-security) s="${{ needs.project-security.result }}" ;;
              esac
              [ "$s" = "skipped" ] && skipped=$((skipped + 1))
            done
            if [ "$skipped" -ge "$expected_skipped" ]; then
              echo "docs-only PR: $skipped jobs skipped as expected"
              exit 0
            else
              echo "docs-only PR expected $expected_skipped \
                skipped, got $skipped"
              echo "results: $results"
              exit 1
            fi
          fi

          if [ -n "$failures" ]; then
            echo "FAIL: $failures"
            echo "all results: $results"
            exit 1
          fi

          echo "CI / Required: all \
            5 active jobs passed"
          exit 0
