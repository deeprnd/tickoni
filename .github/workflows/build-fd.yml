name: Build Firedancer

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-fd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@just

      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          paths: '^(src/disco/|src/tango/|src/waltz/|src/util/|config/|contrib/setup/|contrib/build/|justfile$|build\.zig$|GNUmakefile$|\.github/actions/build-fd-tk-libs/|\.github/workflows/build-fd\.yml$)'

  # ── Linux: GCC (x86_64) ────────────────────────────────────────────────────
  build-linux-gcc:
    name: Engine Build / Linux GCC
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just

      - name: Setup minimal FD deps (Linux GCC)
        run: just setup-fd-linux-x86-gcc

      - name: Build
        run: just build-fd-linux-x86-gcc

  # ── Linux: Clang (x86_64) ──────────────────────────────────────────────────
  build-linux-clang:
    name: Engine Build / Linux Clang
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just

      - name: Setup minimal FD deps (Linux Clang)
        run: just setup-fd-linux-x86-clang

      - name: Build
        run: just build-fd-linux-x86-clang

  # ── Linux: GCC (ARM64) ─────────────────────────────────────────────────────
  build-linux-arm:
    name: Engine Build / Linux ARM
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just

      - name: Setup minimal FD deps (Linux ARM GCC)
        run: just setup-fd-linux-arm-gcc

      - name: Build
        run: just build-fd-linux-arm-gcc

  # ── macOS: Clang (x86_64) ──────────────────────────────────────────────────
  build-macos-x86_64:
    name: Engine Build / macOS x86_64
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just

      - name: Setup minimal FD deps (macOS x86)
        run: just setup-fd-macos-x86

      - name: Build
        run: just build-fd-macos-x86

  # ── macOS: Clang (ARM64) ───────────────────────────────────────────────────
  build-macos-arm:
    name: Engine Build / macOS ARM
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just

      - name: Setup minimal FD deps (macOS ARM)
        run: just setup-fd-macos-arm

      - name: Build
        run: just build-fd-macos-arm

  # ── Windows: Clang (x86_64) ────────────────────────────────────────────────
  build-windows-x86:
    name: Engine Build / Windows x86_64
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just

      - name: Setup minimal FD deps (Windows x86_64)
        run: just setup-fd-windows-x86

      - name: Build
        run: just build-fd-windows-x86

  # ── Windows: Clang (ARM64) ─────────────────────────────────────────────────
  build-windows-arm:
    name: Engine Build / Windows ARM64
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just

      - name: Setup minimal FD deps (Windows ARM64)
        run: just setup-fd-windows-arm

      - name: Build
        run: just build-fd-windows-arm
