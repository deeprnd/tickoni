name: Dev Setup Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@just

      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          paths: '^(src/(app/tickoni|tickoni)/|contrib/setup/|justfile$|build\\.zig$|\\.zig-version$|GNUmakefile$|\\.github/workflows/tests-dev-setup\\.yml$)'

  # ── Linux x86_64: full dev setup → build → unit → integration → system ──
  dev-setup-linux-x86:
    name: Dev Setup / Linux x86_64
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just

      - name: Dev setup (Linux x86_64 GCC)
        run: just setup-linux-x86-gcc

      - name: Configure hugepages and memory limits
        run: |
          sudo prlimit --pid $$ --nofile=65536 --memlock=unlimited
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' || true
          sudo src/util/shmem/fd_shmem_cfg init 0700 "$USER" ""
          sudo src/util/shmem/fd_shmem_cfg alloc-auto 0

      - name: Run validation test suite
        run: just build-all test-unit-tk test-integration-all test-system-all

  # ── Linux ARM64: full dev setup → build → unit → integration → system ──
  dev-setup-linux-arm:
    name: Dev Setup / Linux ARM64
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just

      - name: Dev setup (Linux ARM64 GCC)
        run: just setup-linux-arm-gcc

      - name: Configure hugepages and memory limits
        run: |
          sudo prlimit --pid $$ --nofile=65536 --memlock=unlimited
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' || true
          sudo src/util/shmem/fd_shmem_cfg init 0700 "$USER" ""
          sudo src/util/shmem/fd_shmem_cfg alloc-auto 0

      - name: Run validation test suite
        run: just build-all test-unit-tk test-integration-all test-system-all

  # ── macOS 15 (x86_64): full dev setup → build → unit → integration → system ──
  dev-setup-macos-15-x86:
    name: Dev Setup / macOS 15 (x86_64)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just

      - name: Dev setup (macOS x86)
        run: just setup-macos-x86

      - name: Run validation test suite
        run: just build-all test-unit-tk test-integration-all test-system-all

  # ── macOS 15 (ARM): full dev setup → build → unit → integration → system ──
  dev-setup-macos-15-arm:
    name: Dev Setup / macOS 15 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just

      - name: Dev setup (macOS ARM)
        run: just setup-macos-arm

      - name: Run validation test suite
        run: just build-all test-unit-tk test-integration-all test-system-all

  # ── macOS 26 (x86_64): full dev setup → build → unit → integration → system ──
  dev-setup-macos-26-x86:
    name: Dev Setup / macOS 26 (x86_64)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just

      - name: Dev setup (macOS x86)
        run: just setup-macos-x86

      - name: Run validation test suite
        run: just build-all test-unit-tk test-integration-all test-system-all

  # ── macOS 26 (ARM): full dev setup → build → unit → integration → system ──
  dev-setup-macos-26-arm:
    name: Dev Setup / macOS 26 (ARM)
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just

      - name: Dev setup (macOS ARM)
        run: just setup-macos-arm

      - name: Run validation test suite
        run: just build-all test-unit-tk test-integration-all test-system-all

  # ── Windows x86_64: full dev setup → build → unit → integration → system ──
  dev-setup-windows-x86:
    name: Dev Setup / Windows x86_64
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just

      - name: Dev setup (Windows x86_64)
        run: just setup-windows-x86

      - name: Run validation test suite
        run: just build-all test-unit-tk test-integration-all test-system-all

  # ── Windows ARM64: full dev setup → build → unit → integration → system ──
  dev-setup-windows-arm:
    name: Dev Setup / Windows ARM64
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just

      - name: Dev setup (Windows ARM64)
        run: just setup-windows-arm

      - name: Run validation test suite
        run: just build-all test-unit-tk test-integration-all test-system-all
