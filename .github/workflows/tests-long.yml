name: Tests / Long

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-long-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          paths: '^(src/|build\.zig(\.zon)?$|justfile$|contrib/test/|contrib/build/|contrib/tool/|\.github/actions/|\.github/workflows/tests-long\.yml$)'

  long-tests:
    name: Engine Unit Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        run: just setup-linux-x86-gcc

      - name: Set resource limits and run tests
        run: |
          open_files="$(awk '/#define CONFIGURE_NR_OPEN_FILES/ { gsub(/[()U]/, "", $3); print $3 }' src/app/shared/commands/configure/configure.h)"
          echo "Setting NOFILE=$open_files:$open_files and MEMLOCK=unlimited"
          sudo prlimit --pid $$ --nofile="$open_files:$open_files" --memlock=unlimited
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' || echo "drop-caches skipped (may be read-only or non-root)"
          just test-unit-fd-linux-x86-gcc
