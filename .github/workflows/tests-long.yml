name: Tests / Long

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-long-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          paths: '^(src/|build\.zig(\.zon)?$|justfile$|contrib/test/|contrib/build/|contrib/tool/|\.github/actions/|\.github/workflows/tests-long\.yml$)'

  long-tests:
    name: Engine Unit Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Firedancer test environment
        uses: ./.github/actions/setup-fd-test
        with:
          setup-recipe: setup-linux-x86-gcc
          deps-recipe: setup-fd-deps-linux-x86-gcc
          configure-hugepages: 'false'

      - name: Run test suite
        run: |
          just test-prep-linux-x86
          just test-unit-fd-linux-x86-gcc
