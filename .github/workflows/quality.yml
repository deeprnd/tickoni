name: Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-slim
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/detect-changes
        id: detect
        with:
          paths: '^(src/|build\.zig(\.zon)?$|justfile$|contrib/quality\.sh$|contrib/lint/check_include_guards\.py$|\.github/actions/|\.github/workflows/quality\.yml$)'

  checks:
    name: ${{ matrix.name }}
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format Check
            timeout_minutes: 20
            command: just quality-format-check-linux-x86
          - name: Lint Check
            timeout_minutes: 30
            command: just quality-lint-check-linux-x86
          - name: Proto Check
            timeout_minutes: 10
            command: just quality-proto-check-linux-x86
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create local main branch for diff-based quality scripts
        run: git branch --force main origin/main

      - name: Setup public GitHub runner
        uses: ./.github/actions/setup-public-gh-runner
        with:
          setup-recipe: setup-linux-x86-gcc
          apt-packages: shellcheck
          python-tools: pre-commit
          zig: 'true'

      - uses: ./.github/actions/build-fd-tk-libs

      - name: Run check
        run: ${{ matrix.command }}
