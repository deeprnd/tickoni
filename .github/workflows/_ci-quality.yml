---
# Reusable Quality workflow: format, lint, proto, yaml — no FD build needed.
# This is the first gate after plan. If quality fails, nothing builds.
#
# Reference: doc/execution/plans/v2.10-s8-5.md

name: Quality Stage

'on':
  workflow_call:

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format Check
            command: just quality-format-check-linux-x86
            timeout_minutes: 30
          - name: Lint Check
            command: just quality-lint-check-linux-x86
            timeout_minutes: 30
          - name: Proto Check
            command: just quality-proto-check-linux-x86
            timeout_minutes: 10
          - name: YAML Check
            command: just quality-yaml-check-linux
            timeout_minutes: 10
          - name: Spell Check
            command: just quality-spell-check-linux
            timeout_minutes: 10
            skip: true
          - name: Qt Quality Check
            command: just quality-format-check-qt && just quality-lint-check-qt
            timeout_minutes: 15
            skip: true  # off by default until Qt6 is available on CI runners
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create local main branch for diff-based quality scripts
        run: |
          git fetch origin main
          git branch --force main origin/main

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Setup minimal quality deps
        run: just setup-quality-linux-x86

      - name: Run check
        if: ${{ matrix.skip != true }}
        run: ${{ matrix.command }}
