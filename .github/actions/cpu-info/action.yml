---
name: cpu-info
description: 'Print CPU details for the current runner (Linux, macOS, Windows)'
inputs:
  detail:
    description: 'How much detail to print — "full" dumps raw output, "summary" prints a compact one-liner'
    required: false
    default: summary
runs:
  using: composite
  steps:
    - name: Print CPU info
      shell: bash
      env:
        DETAIL: ${{ inputs.detail }}
      run: |
        set -euo pipefail

        os_name="${RUNNER_OS}"
        echo "=== CPU info on $os_name ($RUNNER_ARCH) ==="

        if [ "$os_name" = "Linux" ]; then
          if [ "$DETAIL" = "full" ]; then
            cat /proc/cpuinfo
          else
            model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)
            cores=$(grep -c '^processor' /proc/cpuinfo)
            family=$(grep -m1 'cpu family' /proc/cpuinfo | cut -d: -f2 | xargs)
            model_num=$(grep -m1 'model' /proc/cpuinfo | cut -d: -f2 | xargs)
            mhz=$(grep -m1 'cpu MHz' /proc/cpuinfo | cut -d: -f2 | xargs)
            cache=$(grep -m1 'cache size' /proc/cpuinfo | cut -d: -f2 | xargs)
            flags=$(grep -m1 'flags' /proc/cpuinfo | cut -d: -f2 | xargs | tr ' ' ',')
            echo "Model:    $model"
            echo "Cores:    $cores"
            echo "Family:   $family / Model: $model_num"
            echo "MHz:      $mhz"
            [ -n "$cache" ] && echo "Cache:    $cache"
            echo "Flags:    ${flags:0:120}…"
          fi

        elif [ "$os_name" = "macOS" ]; then
          if [ "$DETAIL" = "full" ]; then
            sysctl -a | grep -E '^hw\.(cpu|mem)' | sort
          else
            model=$(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo "N/A")
            cores=$(sysctl -n hw.ncpu 2>/dev/null || echo "N/A")
            phys=$(sysctl -n hw.physicalcpu 2>/dev/null || echo "N/A")
            l2cache=$(sysctl -n hw.l2cachesize 2>/dev/null || echo "N/A")
            echo "Model:    $model"
            echo "Cores:    $cores (physical: $phys)"
            [ "$l2cache" != "N/A" ] && echo "L2 Cache: ${l2cache} KB"
          fi

        elif [ "$os_name" = "Windows" ]; then
          if [ "$DETAIL" = "full" ]; then
            powershell -NoProfile -Command "Get-CimInstance Win32_Processor | Format-List *"
          else
            powershell -NoProfile -Command "
              \$cpu = Get-CimInstance Win32_Processor
              Write-Host \"Model:    $($cpu.Name)\"
              Write-Host \"Cores:    $($cpu.NumberOfCores) x $([environment]::ProcessorCount) logical\"
              Write-Host \"Max MHz:  $($cpu.MaxClockSpeed)\"
              Write-Host \"L3 Cache: $([math]::Round(\$($cpu.L3CacheSize)/1MB, 1)) MB\"
            "
          fi
        else
          echo "Unknown OS: $os_name — running uname -a"
          uname -a
        fi

        echo "=== end CPU info ==="
