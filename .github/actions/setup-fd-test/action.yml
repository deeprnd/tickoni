name: Setup Firedancer Test Environment
description: Setup public GitHub runner with Firedancer deps, online CPUs, and hugepages

inputs:
  setup-recipe:
    description: Fully-qualified just setup recipe for this CI lane
    required: true
  deps-recipe:
    description: Fully-qualified just dependency recipe for this CI lane
    required: false
    default: setup-fd-deps-linux-x86-gcc
  compiler:
    description: Compiler for Firedancer deps setup
    required: false
    default: gcc
  compiler-version:
    description: Compiler version for Firedancer deps setup
    required: false
    default: system
  configure-hugepages:
    description: Configure hugepages for jobs that need gigantic-page-backed tests
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup public GitHub runner
      uses: ./.github/actions/setup-public-gh-runner
      with:
        fd-deps: 'true'
        setup-recipe: ${{ inputs.setup-recipe }}
        deps-recipe: ${{ inputs.deps-recipe }}
        compiler: ${{ inputs.compiler }}
        compiler-version: ${{ inputs.compiler-version }}

    - name: Enable all CPUs
      uses: ./.github/actions/cpusonline

    - name: Configure hugepages
      if: inputs.configure-hugepages == 'true'
      uses: ./.github/actions/hugepages
      with:
        count_gigantic: 6
        count_huge: 64
