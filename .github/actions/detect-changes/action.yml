---
name: Detect Changes
description: >-
  Outputs run=true if any changed file in the PR matches the
  given ERE pattern, or when triggered by workflow_dispatch.
  Requires the repository to already be checked out with
  fetch-depth: 0.

inputs:
  paths:
    description: >-
      Extended regex (ERE) pattern matched against the list of
      changed file paths
    required: true

outputs:
  run:
    description: >-
      "true" if CI should run, "false" if the job should be skipped
    value: ${{ steps.check.outputs.run }}

runs:
  using: composite
  steps:
    - name: Check for relevant changes
      id: check
      shell: bash
      env:
        PATHS_PATTERN: ${{ inputs.paths }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
        if echo "$changed" | grep -qE "$PATHS_PATTERN"; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
        fi
