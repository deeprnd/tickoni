name: Build Firedancer C libs for Tickoni
description: Build libfd_tango, libfd_util, libfd_ballet, libfd_disco, and libfd_waltz — required by the Zig harness build

inputs:
  build-recipe:
    description: Fully-qualified just recipe for the Firedancer libraries
    required: false
    default: build-fd-tk-libs

runs:
  using: composite
  steps:
    - name: Build libfd_tango, libfd_util, libfd_ballet, libfd_disco, and libfd_waltz
      shell: bash
      run: just "${{ inputs.build-recipe }}"
