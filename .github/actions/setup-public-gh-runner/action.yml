name: Setup Public GitHub Runner
description: Setup just, Zig, optional Python tooling, optional apt packages, and Firedancer deps on GitHub-hosted runners

inputs:
  apt-packages:
    description: Space-delimited apt packages to install (legacy — lane scripts handle this)
    required: false
    default: ''
  compiler:
    description: Compiler for Firedancer deps setup
    required: false
    default: gcc
  compiler-version:
    description: Compiler version for Firedancer deps setup
    required: false
    default: system
  fd-deps:
    description: Install Firedancer build dependencies
    required: false
    default: 'false'
  gitleaks:
    description: Install gitleaks (legacy — lane scripts handle this)
    required: false
    default: 'false'
  kcov:
    description: Build and install kcov from source (legacy — lane scripts handle this)
    required: false
    default: 'false'
  python-tools:
    description: Space-delimited Python packages to install with pip
    required: false
    default: ''
  zig:
    description: Install Zig
    required: false
    default: 'false'
  zig-version:
    description: Official Zig release version or channel key from index.json
    required: false
    default: '0.16.0'

runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@just

    - name: Run platform setup
      shell: bash
      run: |
        os="${{ runner.os == 'Linux' && 'linux' || runner.os == 'macOS' && 'macos' || 'windows' }}"
        arch="${{ runner.arch == 'ARM64' && 'arm' || 'x86' }}"
        compiler="${{ inputs.compiler }}"
        if [ "$os" = "windows" ]; then
          pwsh "$GITHUB_WORKSPACE/contrib/setup/windows-${arch}.ps1" -NoLLM
        elif [ "$os" = "linux" ] && [ "$compiler" = "clang" ]; then
          just "setup-${os}-${arch}-clang"
        elif [ "$os" = "linux" ]; then
          just "setup-${os}-${arch}-gcc"
        else
          just "setup-${os}-${arch}"
        fi

    - name: Setup Python
      if: inputs.python-tools != ''
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Python tools
      if: inputs.python-tools != ''
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install ${{ inputs.python-tools }}

    - name: Install Firedancer deps
      if: inputs.fd-deps == 'true'
      uses: ./.github/actions/deps
      with:
        compiler: ${{ inputs.compiler }}
        compiler-version: ${{ inputs.compiler-version }}
        extras: +dev
