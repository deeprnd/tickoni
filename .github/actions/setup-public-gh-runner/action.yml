name: Setup Public GitHub Runner
description: Setup just, Zig, optional Python tooling, optional apt packages, and Firedancer deps on GitHub-hosted runners

inputs:
  apt-packages:
    description: Space-delimited apt packages to install
    required: false
    default: ''
  compiler:
    description: Compiler for Firedancer deps setup
    required: false
    default: gcc
  compiler-version:
    description: Compiler version for Firedancer deps setup
    required: false
    default: system
  fd-deps:
    description: Install Firedancer build dependencies
    required: false
    default: 'false'
  gitleaks:
    description: Install gitleaks
    required: false
    default: 'false'
  kcov:
    description: Build and install kcov from source
    required: false
    default: 'false'
  python-tools:
    description: Space-delimited Python packages to install with pip
    required: false
    default: ''
  zig:
    description: Install Zig
    required: false
    default: 'false'
  zig-version:
    description: Official Zig release version or channel key from index.json
    required: false
    default: '0.16.0'

runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@just

    - name: Install gmake on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Homebrew no longer has 'gmake' — 'make' IS GNU make, installed as 'gmake' in gnubin
        brew install make
        echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

    - name: Install Windows bootstrap tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        .github/actions/setup-public-gh-runner/scripts/setup-windows.ps1 -AptPackages '${{ inputs.apt-packages }}' -InstallGnuMake -InstallGitleaks:('${{ inputs.gitleaks }}' -eq 'true') -GitleaksVersion '8.30.1' -InstallKcov:('${{ inputs.kcov }}' -eq 'true')

    - name: Setup Zig via official release (Windows)
      if: inputs.zig == 'true' && runner.os == 'Windows'
      shell: pwsh
      env:
        # Force Zig to target aarch64-windows (MSVC ABI) on ARM runners.
        # zigw.sh reads ZIG_TARGET_OVERRIDE and passes it as -Dtarget.
        # The FD libs on Windows are compiled with --target=aarch64-windows-msvc.
        # Using aarch64-windows-gnu as Zig target on the MSVC-ABI Zig binary
        # causes a segfault (Zig doesn't support cross-compiling MSVC→GNU on ARM).
        # aarch64-windows is the only native ARM64 Windows Zig ABI available.
        ZIG_TARGET_OVERRIDE: ${{ runner.os == 'Windows' && runner.arch == 'ARM64' && 'aarch64-windows' || '' }}
      run: |
        $zigArgs = @('--version', '${{ inputs.zig-version }}')
        if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') {
          # Install native Windows ARM64 zig with MSVC ABI (aarch64-windows).
          # This is the only native ARM64 Windows Zig binary available; it
          # must match the FD libs which are compiled with
          # --target=aarch64-windows-msvc. Using aarch64-windows-gnu would
          # segfault because Zig cannot cross-compile MSVC→GNU ABI on ARM.
          $zigArgs += @('--target', 'aarch64-windows')
        }
        python "$env:GITHUB_WORKSPACE/contrib/install-zig.py" @zigArgs
        if ($env:ZIG_TARGET_OVERRIDE) {
          # Persist for later bash build/test steps; step-local env does not
          # survive across GitHub Actions steps.
          "ZIG_TARGET_OVERRIDE=$env:ZIG_TARGET_OVERRIDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }

    - name: Setup Zig via official release (POSIX)
      if: inputs.zig == 'true' && runner.os != 'Windows'
      shell: bash
      run: |
        python3 "$GITHUB_WORKSPACE/contrib/install-zig.py" --version '${{ inputs.zig-version }}'

    - name: Setup Python
      if: inputs.python-tools != ''
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Python tools
      if: inputs.python-tools != ''
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install ${{ inputs.python-tools }}

    - name: Install apt packages
      if: inputs.apt-packages != '' && runner.os != 'Windows'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ inputs.apt-packages }}

    - name: Install kcov
      if: inputs.kcov == 'true' && runner.os != 'Windows'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          binutils-dev \
          cmake \
          libcurl4-openssl-dev \
          libdw-dev \
          libelf-dev \
          libiberty-dev \
          libssl-dev \
          libstdc++-12-dev \
          zlib1g-dev
        git clone --depth 1 https://github.com/SimonKagstrom/kcov.git "$RUNNER_TEMP/kcov-src"
        cmake -S "$RUNNER_TEMP/kcov-src" -B "$RUNNER_TEMP/kcov-build"
        make -j$(nproc) -C "$RUNNER_TEMP/kcov-build"
        sudo make -C "$RUNNER_TEMP/kcov-build" install

    - name: Install Gitleaks
      if: inputs.gitleaks == 'true' && runner.os != 'Windows'
      shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
      run: |
        mkdir -p "$RUNNER_TEMP/gitleaks"
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64)   asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" ;;
          Linux-ARM64) asset="gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz" ;;
          macOS-X64)   asset="gitleaks_${GITLEAKS_VERSION}_darwin_x64.tar.gz" ;;
          macOS-ARM64) asset="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz" ;;
          *)
            echo "unsupported runner for gitleaks asset selection: ${{ runner.os }}-${{ runner.arch }}" >&2
            exit 1
            ;;
        esac
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}" -o "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz"
        tar -xzf "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"
        chmod +x "$RUNNER_TEMP/gitleaks/gitleaks"
        echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

    - name: Install Firedancer deps
      if: inputs.fd-deps == 'true'
      uses: ./.github/actions/deps
      with:
        compiler: ${{ inputs.compiler }}
        compiler-version: ${{ inputs.compiler-version }}
        extras: +dev
