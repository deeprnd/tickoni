name: Setup Public GitHub Runner
description: Setup just, Zig, optional Python tooling, optional apt packages, and Firedancer deps on GitHub-hosted runners

inputs:
  apt-packages:
    description: Space-delimited apt packages to install (legacy — lane scripts handle this)
    required: false
    default: ''
  compiler:
    description: Compiler for Firedancer deps setup
    required: false
    default: gcc
  compiler-version:
    description: Compiler version for Firedancer deps setup
    required: false
    default: system
  fd-deps:
    description: Install Firedancer build dependencies
    required: false
    default: 'false'
  security:
    description: Install security tools (gitleaks and Linux CBMC toolchain) — off by default, opt-in via CI matrix
    required: false
    default: 'false'
  kcov:
    description: Build and install kcov from source (legacy — lane scripts handle this)
    required: false
    default: 'false'
  python-tools:
    description: Space-delimited Python packages to install with pip
    required: false
    default: ''
  zig:
    description: Install Zig
    required: false
    default: 'false'
  zig-version:
    description: Official Zig release version or channel key from index.json
    required: false
    default: '0.17.0-dev.1770+5d7cf3f34'
  setup-recipe:
    description: Fully-qualified just setup recipe for this CI lane
    required: false
    default: setup-linux-x86-gcc
  deps-recipe:
    description: Fully-qualified just dependency recipe for this CI lane
    required: false
    default: setup-fd-deps-linux-x86-gcc

runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@just

    - name: Run platform setup
      shell: bash
      env:
        SETUP_RECIPE: ${{ inputs.setup-recipe }}
        SECURITY: ${{ inputs.security == 'true' && 'on' || 'off' }}
      run: |
        set -euo pipefail
        case "$SETUP_RECIPE" in
          setup-linux-x86-gcc|setup-linux-x86-clang|setup-linux-arm-gcc|setup-macos-x86|setup-macos-arm|setup-windows-ci-x86|setup-windows-ci-arm)
            just "$SETUP_RECIPE"
            ;;
          *)
            echo "unsupported setup recipe: $SETUP_RECIPE" >&2
            exit 1
            ;;
        esac

    - name: Install Python tools
      if: inputs.python-tools != ''
      shell: bash
      env:
        PYTHON_TOOLS: ${{ inputs.python-tools }}
      run: |
        set -euo pipefail
        case "$PYTHON_TOOLS" in
          pre-commit|huggingface_hub[cli])
            just setup-python-tools "$PYTHON_TOOLS"
            ;;
          *)
            echo "unsupported Python tool set" >&2
            exit 1
            ;;
        esac

    - name: Install Firedancer deps
      if: inputs.fd-deps == 'true'
      shell: bash
      env:
        DEPS_RECIPE: ${{ inputs.deps-recipe }}
      run: |
        set -euo pipefail
        case "$DEPS_RECIPE" in
          setup-fd-deps-linux-x86-gcc|setup-fd-deps-linux-x86-clang|setup-fd-deps-linux-arm-gcc)
            just "$DEPS_RECIPE"
            ;;
          *)
            echo "unsupported Firedancer dependency recipe: $DEPS_RECIPE" >&2
            exit 1
            ;;
        esac
