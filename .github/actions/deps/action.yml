name: deps
description: 'Build and cache dependencies'
inputs:
  deps-script-path:
    description: 'Path of deps.sh script'
    required: true
    default: './contrib/build/deps.sh'
  deps-bundle-path:
    description: 'Path of deps-bundle.sh script'
    required: true
    default: './contrib/build/deps-bundle.sh'
  extras:
    description: Extra flags
    required: true
    default: ''
  compiler:
    description: 'The compiler to use'
    required: true
    default: 'gcc'
    type: choice
    options:
      - gcc
      - clang
  compiler-version:
    description: 'The compiler version to use'
    required: true
    default: 'system'
outputs: {}
runs:
  using: composite
  steps:
    - name: Has apt-get?
      shell: bash
      run: |
        if command -v apt-get > /dev/null 2>&1; then
          echo "HAS_APT_GET=1" >> $GITHUB_ENV
        else
          echo "HAS_APT_GET=0" >> $GITHUB_ENV
        fi

    - name: Has choco?
      shell: bash
      run: |
        if command -v choco > /dev/null 2>&1; then
          echo "HAS_CHOCO=1" >> $GITHUB_ENV
        else
          echo "HAS_CHOCO=0" >> $GITHUB_ENV
        fi

    - name: Set extras key value
      shell: bash
      id: extras_trimmed
      run: |
        key=$(echo "${{ inputs.extras }}" | sed 's/[[:space:]]//g')
        echo "extras_key=$key" >> $GITHUB_OUTPUT

    - name: apt-get update
      shell: bash
      run: sudo apt-get update
      if: env.HAS_APT_GET == '1'

    - id: deps-sh-hash
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          cat /etc/os-release '${{ inputs.deps-script-path }}' | sha256sum | awk '{print "HASH=" $1}' >> "$GITHUB_OUTPUT"
        else
          cat '${{ inputs.deps-script-path }}' | sha256sum | awk '{print "HASH=" $1}' >> "$GITHUB_OUTPUT"
        fi

    - id: deps-sh-cache
      if: runner.os != 'Windows'
      uses: corca-ai/local-cache@v2
      with:
        base: "${{ runner.tool_cache }}/cache"
        path: deps-bundle.tar.zst
        key: deps-sh-${{ runner.os }}-${{ runner.arch }}-${{ inputs.compiler }}-${{ inputs.compiler-version }}-${{ steps.extras_trimmed.outputs.extras_key }}-${{ steps.deps-sh-hash.outputs.HASH }}
        clean-key: deps-sh

    - name: Install system level dependencies
      shell: bash
      run: |
        CC='${{ inputs.compiler }}' \
        CXX='${{ inputs.compiler == 'gcc' && 'g++' || 'clang++' }}' \
        FD_AUTO_INSTALL_PACKAGES=1 \
        '${{ inputs.deps-script-path }}' check

    - name: Ensure zstd CLI is available
      shell: bash
      run: |
        if command -v zstd >/dev/null 2>&1; then
          echo "zstd already installed"
        elif [ "${{ runner.os }}" = "macOS" ]; then
          brew install zstd
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH
        elif [ "${{ runner.os }}" = "Windows" ]; then
          powershell -NoProfile -ExecutionPolicy Bypass -File .github/actions/deps/scripts/install-zstd-windows.ps1
        elif [ "${{ env.HAS_APT_GET }}" = "1" ]; then
          sudo apt-get install -y zstd
        else
          echo "zstd not available and no install method known"
          exit 1
        fi

    - name: Install dependencies from cache
      shell: bash
      run: |
        zstd -d -c deps-bundle.tar.zst | tar -xf -
      if: runner.os != 'Windows' && steps.deps-sh-cache.outputs.cache-hit == 'true'

    - name: Install dependencies from scratch
      shell: bash
      run: |
        if [[ "${{ runner.os }}" = "Linux" && "${{ inputs.compiler-version }}" != "system" ]]; then
          activate_path="/opt/${{ inputs.compiler }}/${{ inputs.compiler }}-${{ inputs.compiler-version }}/activate"
          if [[ -f "$activate_path" ]]; then
            source "$activate_path"
          else
            if [[ "${{ inputs.compiler }}" == "clang" ]]; then
              sudo apt-get install -y clang-${{ inputs.compiler-version }} clang++-${{ inputs.compiler-version }}
            else
              sudo apt-get install -y ${{ inputs.compiler }}-${{ inputs.compiler-version }} g++-${{ inputs.compiler-version }}
            fi
            sudo update-alternatives --install /usr/bin/${{ inputs.compiler }} ${{ inputs.compiler }} \
              /usr/bin/${{ inputs.compiler }}-${{ inputs.compiler-version }} 100
          fi
        fi
        CC='${{ inputs.compiler }}' \
        CXX='${{ inputs.compiler == 'gcc' && 'g++' || 'clang++' }}' \
        FD_AUTO_INSTALL_PACKAGES=1 \
        '${{ inputs.deps-script-path }}' ${{ inputs.extras }} fetch install
        '${{ inputs.deps-bundle-path }}'
      if: runner.os == 'Windows' || steps.deps-sh-cache.outputs.cache-hit != 'true'
